<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1421">
  <meta name="description" content="香港救護行動 3D 場景。放置救護車同救護員，控制方向同車輛行駛。">
  <title>救護行動｜3D 場景編輯器</title>
  <link rel="icon" href="./favicon.png" type="image/png">
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <svg class="symbol-bank" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-cross" viewBox="0 0 24 24">
      <path d="M9 4h6v5h5v6h-5v5H9v-5H4V9h5z" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="i-reset" viewBox="0 0 24 24">
      <path d="M3 11a9 9 0 1 1 2.5 6.2M3 4v7h7"/>
    </symbol>
    <symbol id="i-grid" viewBox="0 0 24 24">
      <rect x="4" y="4" width="16" height="16" rx="2"/>
      <path d="M4 12h16M12 4v16"/>
    </symbol>
    <symbol id="i-top" viewBox="0 0 24 24">
      <rect x="6" y="6" width="12" height="12" rx="1"/>
      <path d="M3 9V3h6m6 0h6v6m0 6v6h-6m-6 0H3v-6"/>
    </symbol>
    <symbol id="i-cube" viewBox="0 0 24 24">
      <path d="m12 3 9 5v8l-9 5-9-5V8l9-5Zm9 5-9 5-9-5m9 5v8"/>
    </symbol>
    <symbol id="i-street" viewBox="0 0 24 24">
      <path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6-10-6-10-6Z"/>
      <circle cx="12" cy="12" r="2.5"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24">
      <path d="M5 12h14m-7-7v14"/>
    </symbol>
    <symbol id="i-target" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="7"/>
      <path d="M12 2v6m0 8v6M2 12h6m8 0h6"/>
    </symbol>
    <symbol id="i-left" viewBox="0 0 24 24">
      <path d="M3 11a9 9 0 1 1 2.5 6.2M3 4v7h7"/>
    </symbol>
    <symbol id="i-right" viewBox="0 0 24 24">
      <path d="M21 11a9 9 0 1 0-2.5 6.2M21 4v7h-7"/>
    </symbol>
    <symbol id="i-play" viewBox="0 0 24 24">
      <path d="m8 5 12 7-12 7z" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="i-pause" viewBox="0 0 24 24">
      <path d="M7 5h3v14H7zm7 0h3v14h-3z" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="i-trash" viewBox="0 0 24 24">
      <path d="M4 7h16m-14 0 1 13h10l1-13M10 7V4h4v3m-4 4v5m4-5v5"/>
    </symbol>
    <symbol id="i-alert" viewBox="0 0 24 24">
      <path d="M10.3 4.7a2 2 0 0 1 3.4 0l7.4 13.2A1.5 1.5 0 0 1 19.8 20H4.2a1.5 1.5 0 0 1-1.3-2.1zM12 9v4m0 3.4v.2"/>
    </symbol>
  </svg>

  <header class="app-header">
    <div class="identity">
      <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-cross"/></svg></span>
      <div>
        <h1>救護行動</h1>
        <p>3D 場景編輯器</p>
      </div>
    </div>
    <button type="button" class="secondary-button" id="reset-scene">
      <svg class="icon" aria-hidden="true"><use href="#i-reset"/></svg>
      重設場景
    </button>
  </header>

  <main class="studio">
    <section class="stage" aria-labelledby="stage-title">
      <header class="stage-header">
        <h2 id="stage-title"><svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg>演練場景</h2>
        <ul class="triage-legend" aria-label="傷者分流區">
          <li><span class="triage-dot triage-red"></span>緊急</li>
          <li><span class="triage-dot triage-yellow"></span>延後</li>
          <li><span class="triage-dot triage-green"></span>輕傷</li>
        </ul>
      </header>

      <div id="viewport" class="viewport">
        <div id="render-surface" class="render-surface" aria-label="救護行動 3D 場景"></div>
        <div id="webgl-error" class="webgl-error" role="alert" hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg>
          <strong>未能開啟 3D 場景</strong>
          <span>請使用支援 WebGL 2 嘅瀏覽器。</span>
        </div>
        <div class="view-bar" role="group" aria-label="鏡頭角度">
          <button type="button" data-view="overview" aria-pressed="true">
            <svg class="icon" aria-hidden="true"><use href="#i-cube"/></svg>全景
          </button>
          <button type="button" data-view="top" aria-pressed="false">
            <svg class="icon" aria-hidden="true"><use href="#i-top"/></svg>俯視
          </button>
          <button type="button" data-view="street" aria-pressed="false">
            <svg class="icon" aria-hidden="true"><use href="#i-street"/></svg>地面
          </button>
        </div>
      </div>

      <footer class="stage-footer">
        <p id="scene-status" role="status" aria-live="polite">拖動右邊嘅物件入場，或者點選後放置。</p>
        <p class="camera-help">拖曳旋轉<span>·</span>滾輪縮放<span>·</span>右鍵平移</p>
        <p class="touch-help">單指旋轉<span>·</span>雙指縮放同移動</p>
      </footer>
    </section>

    <aside class="sidebar" aria-label="場景控制">
      <section class="panel" aria-labelledby="palette-title">
        <div class="panel-heading">
          <h2 id="palette-title">物件庫</h2>
          <p>拖入場景，或點選後放置</p>
        </div>
        <div class="palette">
          <button type="button" class="asset asset-vehicle" data-asset="ambulance" aria-label="放置救護車">
            <span class="asset-thumb" aria-hidden="true">
              <svg viewBox="0 0 48 36">
                <path d="M4 13h24l8 5 7 9H4z" fill="#6d8095" opacity=".46" transform="translate(0 2)"/>
                <path d="M5 10h23l8 4 6 9v5H5z" fill="#ffe36b"/>
                <path d="M5 18h25l10 6v4H5z" fill="#f1ce3d"/>
                <path d="M5 22h32" stroke="#2376b4" stroke-width="2.3"/>
                <path d="M29 13l6 2.3 4 6h-10z" fill="#263e54"/>
                <path d="M10 10V8h10v2" stroke="#5cc9ff" stroke-width="2.4" stroke-linejoin="round"/>
                <path d="M15 12h3v3h3v3h-3v3h-3v-3h-3v-3h3z" fill="#2376b4" transform="translate(0 0) scale(.85)"/>
                <circle cx="13" cy="28" r="4" fill="#162539" stroke="#60758c" stroke-width="1.2"/>
                <circle cx="34" cy="28" r="4" fill="#162539" stroke="#60758c" stroke-width="1.2"/>
                <path d="M39 24h3" stroke="#fff2a2" stroke-width="2"/>
              </svg>
            </span>
            <span class="asset-description"><strong>救護車</strong><small>可轉向同開車</small></span>
            <svg class="icon asset-add" aria-hidden="true"><use href="#i-plus"/></svg>
          </button>

          <button type="button" class="asset asset-crew" data-asset="crew" aria-label="放置救護員">
            <span class="asset-thumb" aria-hidden="true">
              <svg viewBox="0 0 48 36">
                <ellipse cx="24" cy="32" rx="10" ry="2" fill="#080f1b" opacity=".7"/>
                <path d="M20 22h8l1 10h-4l-1-7-1 7h-4z" fill="#475d7e"/>
                <path d="m17 14 4-3h6l4 3 2 9-4 1-2-6v7h-6v-7l-2 6-4-1z" fill="#eabc52"/>
                <path d="M19 19h10m-9 4h8" stroke="#e9eddd" stroke-width="1.5"/>
                <path d="M21 8h6v5h-6z" fill="#ddb393"/>
                <path d="M19 8a5 5 0 0 1 10 0l1 1H18z" fill="#e5735d"/>
              </svg>
            </span>
            <span class="asset-description"><strong>救護員</strong><small>地面救護人員</small></span>
            <svg class="icon asset-add" aria-hidden="true"><use href="#i-plus"/></svg>
          </button>

          <button type="button" class="asset asset-officer" data-asset="officer" aria-label="放置救護隊目">
            <span class="asset-thumb" aria-hidden="true">
              <svg viewBox="0 0 48 36">
                <ellipse cx="24" cy="32" rx="10" ry="2" fill="#080f1b" opacity=".7"/>
                <path d="M20 22h8l1 10h-4l-1-7-1 7h-4z" fill="#475d7e"/>
                <path d="m17 14 4-3h6l4 3 2 9-4 1-2-6v7h-6v-7l-2 6-4-1z" fill="#e7d962"/>
                <path d="M19 19h10m-9 4h8" stroke="#eff0dd" stroke-width="1.5"/>
                <path d="M21 8h6v5h-6z" fill="#ddb393"/>
                <path d="M19 8a5 5 0 0 1 10 0l1 1H18z" fill="#e7edf3"/>
              </svg>
            </span>
            <span class="asset-description"><strong>救護隊目</strong><small>現場指揮人員</small></span>
            <svg class="icon asset-add" aria-hidden="true"><use href="#i-plus"/></svg>
          </button>
        </div>
      </section>

      <section class="panel" aria-labelledby="inspector-title">
        <div class="panel-heading">
          <h2 id="inspector-title">物件控制</h2>
        </div>
        <div class="selection-empty" id="selection-empty">
          <span class="target-mark"><svg class="icon" aria-hidden="true"><use href="#i-target"/></svg></span>
          <p>選取場景中嘅物件<br>就可以調整方向同操作。</p>
        </div>
        <div id="selection-details" class="selection-details" hidden>
          <h3 id="selection-name"></h3>
          <div class="control">
            <div class="range-heading">
              <label for="heading">方向</label>
              <output id="heading-value" for="heading">0°</output>
            </div>
            <div class="heading-controls">
              <button type="button" class="icon-button" id="turn-left" aria-label="向左轉" title="向左轉">
                <svg class="icon" aria-hidden="true"><use href="#i-left"/></svg>
              </button>
              <input id="heading" type="range" min="0" max="359" step="1" value="0">
              <button type="button" class="icon-button" id="turn-right" aria-label="向右轉" title="向右轉">
                <svg class="icon" aria-hidden="true"><use href="#i-right"/></svg>
              </button>
            </div>
          </div>
          <div id="vehicle-controls" class="vehicle-controls" hidden>
            <div class="control">
              <div class="range-heading">
                <label for="speed">車速</label>
                <output id="speed-value" for="speed">4 m/s</output>
              </div>
              <input id="speed" type="range" min="1" max="12" step="1" value="4">
            </div>
            <button type="button" id="drive-toggle" class="action-button" aria-pressed="false">
              <svg class="icon drive-play" aria-hidden="true"><use href="#i-play"/></svg>
              <svg class="icon drive-pause" aria-hidden="true"><use href="#i-pause"/></svg>
              <span id="drive-label">開始行駛</span>
            </button>
          </div>
          <button type="button" id="remove-object" class="remove-button">
            <svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg>
            移除物件
          </button>
        </div>
      </section>

      <section class="panel objects-panel" aria-labelledby="objects-title">
        <div class="panel-heading">
          <h2 id="objects-title">場內物件</h2>
          <span id="asset-count" class="object-count" aria-label="場內物件數量"></span>
        </div>
        <div id="object-list" class="object-list" role="group" aria-label="選取場內物件"></div>
      </section>
    </aside>
  </main>

  <noscript><p class="noscript-warning">請啟用 JavaScript，先可以操作 3D 場景。</p></noscript>
</body>
</html>
